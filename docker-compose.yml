version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - HINDSIGHT_API_KEY=${HINDSIGHT_API_KEY}
      - HINDSIGHT_BASE_URL=${HINDSIGHT_BASE_URL:-https://api.hindsight.vectorize.io}
      - HINDSIGHT_BANK_ID=${HINDSIGHT_BANK_ID:-novacart-production-memory}
      - LLM_MODEL=${LLM_MODEL:-qwen-2.5-32b}
      - DATABASE_URL=sqlite:///./backend/data/deploylens.db
    volumes:
      - ./backend/data:/app/backend/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - backend
